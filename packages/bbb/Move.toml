[package]
name = "suins_bbb"
edition = "2024.beta"

# testnet build: DEX swap modules (Aftermath/Cetus) are excluded, so their
# interface dependencies are not needed here — only Pyth (used by bbb_pyth).
[dependencies]
Pyth = { git = "https://github.com/pyth-network/pyth-crosschain.git", subdir = "target_chains/sui/contracts", rev = "sui-contract-mainnet" }

[addresses]
suins_bbb = "0x0"
