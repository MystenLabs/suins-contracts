[package]
name = "suins-indexer"
version = "0.1.0"
authors = ["Mysten Labs <build@mystenlabs.com>"]
license = "Apache-2.0"
publish = false
edition = "2021"

[dependencies]
tokio = "1.52.1"
async-trait = "0.1.88"
anyhow = "1.0.98"
serde = "1.0.228"
serde_json = "1.0.140"
bcs = "0.1.6"
tempfile = "3.20.0"

sui-indexer-alt-framework = { git = "https://github.com/MystenLabs/sui.git", rev = "782577ca40c9ef0b3f400ade8bc2cc2dcd0e2b23" }
sui-name-service = { git = "https://github.com/MystenLabs/sui.git", rev = "782577ca40c9ef0b3f400ade8bc2cc2dcd0e2b23" }
sui-indexer-alt-metrics = { git = "https://github.com/MystenLabs/sui.git", rev = "782577ca40c9ef0b3f400ade8bc2cc2dcd0e2b23" }
telemetry-subscribers = { git = "https://github.com/MystenLabs/sui.git", rev = "782577ca40c9ef0b3f400ade8bc2cc2dcd0e2b23" }
sui-pg-db = { git = "https://github.com/MystenLabs/sui.git", rev = "782577ca40c9ef0b3f400ade8bc2cc2dcd0e2b23" }
move-core-types = { git = "https://github.com/MystenLabs/sui.git", rev = "782577ca40c9ef0b3f400ade8bc2cc2dcd0e2b23" }
sui-types = { git = "https://github.com/MystenLabs/sui.git", rev = "782577ca40c9ef0b3f400ade8bc2cc2dcd0e2b23" }
prometheus = "0.14"

clap = { version = "4.5.37", features = ["env"] }
diesel = { version = "2.3", features = [
    "postgres",
    "uuid",
    "chrono",
    "serde_json",
    "numeric",
] }
diesel-async = { version = "0.9", features = ["bb8", "postgres"] }
diesel_migrations = "2.3"
url = "2.5.4"

[dev-dependencies]
sui-storage = { git = "https://github.com/MystenLabs/sui.git", rev = "782577ca40c9ef0b3f400ade8bc2cc2dcd0e2b23" }
sqlx = { version = "0.8.3", features = ["runtime-tokio", "postgres", "chrono"] }
fastcrypto = { git = "https://github.com/MystenLabs/fastcrypto", rev = "076bf5ad8cea140dc7cf5c5861c24a36acdf64ce" }
insta = { version = "1.43.1", features = ["json"] }
chrono = "0.4.39"

[[bin]]
name = "suins-indexer"
path = "src/main.rs"
